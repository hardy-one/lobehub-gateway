services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lobehub-gateway-go:latest
    ports:
      - "8787:8787"
      - "8788:8788"
      - "8789:8789"
      - "8790:8790"
      - "8791:8791"
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      JWKS_PUBLIC_KEY: ${JWKS_PUBLIC_KEY:-}
      LOBE_API_BASE_URL: ${LOBE_API_BASE_URL:-}
      PULL_TOKEN: ${PULL_TOKEN:-}
      REQUEST_LOG_ENABLED: ${REQUEST_LOG_ENABLED:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-volcengine}
      VOLCENGINE_VOICE_API_KEY: ${VOLCENGINE_VOICE_API_KEY:-}
      VOLCENGINE_RESOURCE_ID: ${VOLCENGINE_RESOURCE_ID:-volc.seedasr.sauc.duration}

      # ── oss-center (see oss-center-go/README.md) ──
      # Opt-in provisioner for the deployment's SystemBot providers. A platform
      # is declared as soon as its credential group is set; <PLATFORM>_ENABLED=0
      # keeps the row but switches it off. MESSENGER_WECHAT_ENABLED declares
      # WeChat, which owns no deployment credential.
      OSS_CENTER_ENABLED: ${OSS_CENTER_ENABLED:-}
      OSS_CENTER_INTERVAL: ${OSS_CENTER_INTERVAL:-60s}
      OSS_CENTER_ONESHOT: ${OSS_CENTER_ONESHOT:-}
      OSS_CENTER_PORT: ${OSS_CENTER_PORT:-8791}
      MESSAGE_GATEWAY_URL: ${MESSAGE_GATEWAY_URL:-http://localhost:8790}
      MESSENGER_DISCORD_APPLICATION_ID: ${MESSENGER_DISCORD_APPLICATION_ID:-}
      MESSENGER_DISCORD_BOT_TOKEN: ${MESSENGER_DISCORD_BOT_TOKEN:-}
      MESSENGER_DISCORD_PUBLIC_KEY: ${MESSENGER_DISCORD_PUBLIC_KEY:-}
      MESSENGER_DISCORD_CLIENT_SECRET: ${MESSENGER_DISCORD_CLIENT_SECRET:-}
      MESSENGER_DISCORD_ENABLED: ${MESSENGER_DISCORD_ENABLED:-}
      MESSENGER_TELEGRAM_BOT_TOKEN: ${MESSENGER_TELEGRAM_BOT_TOKEN:-}
      MESSENGER_TELEGRAM_BOT_USERNAME: ${MESSENGER_TELEGRAM_BOT_USERNAME:-}
      MESSENGER_TELEGRAM_WEBHOOK_SECRET: ${MESSENGER_TELEGRAM_WEBHOOK_SECRET:-}
      MESSENGER_TELEGRAM_ENABLED: ${MESSENGER_TELEGRAM_ENABLED:-}
      MESSENGER_SLACK_APP_ID: ${MESSENGER_SLACK_APP_ID:-}
      MESSENGER_SLACK_CLIENT_ID: ${MESSENGER_SLACK_CLIENT_ID:-}
      MESSENGER_SLACK_CLIENT_SECRET: ${MESSENGER_SLACK_CLIENT_SECRET:-}
      MESSENGER_SLACK_SIGNING_SECRET: ${MESSENGER_SLACK_SIGNING_SECRET:-}
      MESSENGER_SLACK_ENABLED: ${MESSENGER_SLACK_ENABLED:-}
      MESSENGER_WECHAT_ENABLED: ${MESSENGER_WECHAT_ENABLED:-}
      MESSENGER_LINQ_API_BASE_URL: ${MESSENGER_LINQ_API_BASE_URL:-}
      MESSENGER_LINQ_API_KEY: ${MESSENGER_LINQ_API_KEY:-}
      MESSENGER_LINQ_WEBHOOK_SECRET: ${MESSENGER_LINQ_WEBHOOK_SECRET:-}
      MESSENGER_LINQ_NUMBERS: ${MESSENGER_LINQ_NUMBERS:-}
      MESSENGER_LINQ_ENABLED: ${MESSENGER_LINQ_ENABLED:-}
    restart: unless-stopped
